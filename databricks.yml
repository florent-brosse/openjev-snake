bundle:
  name: delta_serpents

# Optional, git-ignored per-developer targets (workspace host, catalog, warehouse...). See targets.local.yml.example.
include:
  - "*.local.yml"

sync:
  exclude:
    - ".venv/**"
    - "**/__pycache__/**"
    - ".pytest_cache/**"
    - "tests/**"
    - "uv.lock"

variables:
  catalog:
    description: Unity Catalog catalog that will hold the demo schema (required)
  schema:
    description: Schema for the decisions / events / games tables
    default: openjev_demo
  warehouse_id:
    description: SQL warehouse used by the app (async logging) and the dashboard
    lookup:
      warehouse: "Serverless Starter Warehouse"
  openjev_endpoint:
    description: Serving endpoint backing the OpenJev System One model
    default: databricks-openjev-qwen35-4b
  openjev_model:
    description: Unity Catalog model service passed as `model` to the System One route
    default: system.ai.openjev-qwen35-4b
  trace_sample_rate:
    description: Fraction of AI decisions traced to MLflow at random (uncertain and pre-death decisions are always traced)
    default: "0.05"

targets:
  dev:
    default: true

resources:
  apps:
    delta_serpents:
      name: delta-serpents
      description: "Real-time snake arena where AI snakes decide with OpenJev (Databricks System One API)"
      source_code_path: ./app
      config:
        command: ["python", "main.py"]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: OPENJEV_MODEL
            value: ${var.openjev_model}
          - name: OPENJEV_ALLOWED_MODELS
            value: ${var.openjev_model}
          - name: OPENJEV_TABLE_PREFIX
            value: ${var.catalog}.${var.schema}
          - name: OPENJEV_DASHBOARD_URL
            value: ${workspace.host}/dashboardsv3/${resources.dashboards.serpents_dashboard.id}/published
          - name: MLFLOW_EXPERIMENT_ID
            value: ${resources.experiments.serpents_experiment.id}
          - name: TRACE_SAMPLE_RATE
            value: "${var.trace_sample_rate}"
          - name: TRACE_EXPORT_JOB_ID
            value_from: trace-export-job
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: openjev-endpoint
          serving_endpoint:
            name: ${var.openjev_endpoint}
            permission: CAN_QUERY
        - name: trace-export-job
          job:
            id: ${resources.jobs.serpents_traces.id}
            permission: CAN_MANAGE_RUN

  experiments:
    serpents_experiment:
      name: /Workspace/Users/${workspace.current_user.userName}/delta_serpents

  jobs:
    serpents_setup:
      name: "Delta Serpents - setup tables and grants"
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              app_sp: ${resources.apps.delta_serpents.service_principal_client_id}

    serpents_arena:
      name: "Delta Serpents - OpenJev arena evaluation"
      tasks:
        - task_key: arena
          notebook_task:
            notebook_path: ./notebooks/02_arena_eval.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model: ${var.openjev_model}
              experiment_id: ${resources.experiments.serpents_experiment.id}
              matches: "6"
              duration_s: "60"

    serpents_traces:
      name: "Delta Serpents - export selected decisions as MLflow traces"
      max_concurrent_runs: 1
      tasks:
        - task_key: export
          notebook_task:
            notebook_path: ./notebooks/03_export_traces.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              experiment_id: ${resources.experiments.serpents_experiment.id}

  dashboards:
    serpents_dashboard:
      display_name: "Delta Serpents - OpenJev decisions"
      file_path: ./dashboards/openjev_arena.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
