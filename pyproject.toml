[project]
name = "delta-serpents"
version = "0.1.0"
description = "OpenJev on Databricks: a real-time snake arena where AI snakes decide with the System One API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "databricks-sdk>=0.40", "pydantic>=2.7", "mlflow-skinny[databricks]>=3.1"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
